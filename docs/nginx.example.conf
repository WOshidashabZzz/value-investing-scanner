# ============================================================
# Nginx 配置示例 — 多因子股票评分系统
# ============================================================
# 使用方法：
#   1. 将本文件复制到 /etc/nginx/sites-available/
#   2. 修改 server_name 为你的域名
#   3. 修改 proxy_pass 为你的 FastAPI 服务地址
#   4. 修改 root 为你的前端文件路径
#   5. 创建软链接：ln -s /etc/nginx/sites-available/your-config /etc/nginx/sites-enabled/
#   6. 测试配置：nginx -t
#   7. 重载 Nginx：systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name your-domain.com;  # ← 修改为你的域名

    # 前端静态文件
    root /path/to/project/frontend;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;  # ← 修改为你的 FastAPI 地址
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（数据采集接口可能较慢）
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # 前端页面路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

